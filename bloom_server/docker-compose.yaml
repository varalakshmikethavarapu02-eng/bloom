services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: bloom
      POSTGRES_PASSWORD: "VrrECgiIfJKXlj07ES-05UPIQZAIL4dZ"
    volumes:
      - bloom_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "0_Kyosbo6Bmpy5ihzh2PmrMtOPqgc0av"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: bloom_test
      POSTGRES_PASSWORD: "o5mvdyRKBgEbWGHCil_jiahqwvGuMkaV"
    volumes:
      - bloom_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "-Vfy96CerHuQ5cAWkPjkssLxT_H7HGNH"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  bloom_data:
  bloom_test_data:
